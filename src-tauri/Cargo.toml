[package]
name = "pharmatek-gestionale"
version = "0.0.0"
description = "Gestionale PharmaTek - core local-first"
authors = ["PharmaTek"]
edition = "2021"
rust-version = "1.89"

# Libreria condivisa (necessaria per il pattern di avvio Tauri 2 + mobile)
[lib]
name = "pharmatek_gestionale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# Silenzia l'output informativo del linker MSVC ("Creazione della libreria...") su Windows per le cdylib
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` abilita l'icona nell'area di notifica (FASE 6A).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Integrazione col sistema (FASE 6A): istanza singola, avvio automatico, hotkey globale.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Riproduzione nativa del suono di notifica anche a finestra nascosta/non in primo
# piano (FASE 6D): WebView2 congela l'audio JS in background → suona il Rust. Solo
# il decoder WAV (i suoni bundlati sono .wav) per non tirarsi dietro symphonia/mp3.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
minisign-verify = "0.3.0"
base64 = "0.23"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Motore di sync local-first (FASE 1A):
#   notify   -> file-watching della cartella OneDrive (events/)
#   rusqlite -> proiezione locale (read model) in %APPDATA%, SQLite bundled
#   ulid     -> ID ordinabili, generabili offline (event id + entity id)
notify = "8.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ulid = "3"
sha2 = "0.11"
filetime = "0.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.17"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["net", "io-util"] }
tokio-native-tls = "0.3"
zip = "9.4"
unicode-normalization = "0.1"
strsim = "0.11"
# Export Excel nativo (.xlsx) per i riepiloghi (provvigioni, ecc.). Pura Rust.
rust_xlsxwriter = "0.102"
calamine = "0.38.0"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
